name: windows

# Every push builds HeadTrackPC-windows.zip and keeps it as a run artifact (GitHub login needed,
# expires after 90 days). A tag `vX.Y.Z` (or "Run workflow" with a tag name) also publishes the
# same zip on the Releases page, where anyone can download it without an account.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub Release with this tag (e.g. v0.1.0); empty = build only"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  linux-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - run: python -m unittest discover -s tests -t . -v

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Fetch model and opentrack client DLLs
        run: |
          python tools/fetch_models.py
          python tools/fetch_opentrack_libs.py
      - name: Unit tests (incl. real NPClient64.dll / freetrackclient64.dll round trip)
        run: python -m unittest discover -s tests -t . -v
      - name: CLI smoke (phone source, game output on)
        run: python -m headtrack_pc --cli --source phone --duration 3 --calibrate-after 0
      - name: CLI smoke (webcam source; no camera on the runner, must fail gracefully)
        run: python -m headtrack_pc --cli --source webcam --duration 3 --calibrate-after 0
      - name: GUI smoke (Tk window, fake camera, game output on)
        run: python tools/gui_smoke.py --game-output
      - name: Build exe (PyInstaller)
        run: pyinstaller --noconfirm headtrack-pc.spec
      - name: Run the built exe
        run: |
          .\dist\HeadTrackPC\HeadTrackPC-console.exe --version
          .\dist\HeadTrackPC\HeadTrackPC-console.exe --cli --source phone --duration 3 --calibrate-after 0
      - name: Package
        run: Compress-Archive -Path dist\HeadTrackPC -DestinationPath HeadTrackPC-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: HeadTrackPC-windows
          path: HeadTrackPC-windows.zip
      - name: Release tag
        id: tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ github.event.inputs.release_tag }}" ]]; then
            echo "name=${{ github.event.inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish GitHub Release (tags v* or manual run with a tag)
        if: steps.tag.outputs.name != ''
        shell: bash
        run: cp HeadTrackPC-windows.zip "HeadTrackPC-${{ steps.tag.outputs.name }}-windows.zip"
      - uses: softprops/action-gh-release@v2
        if: steps.tag.outputs.name != ''
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: HeadTrack PC ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          body: |
            Windows build (no Python needed): download `HeadTrackPC-${{ steps.tag.outputs.name }}-windows.zip`,
            unzip, run `HeadTrackPC.exe`. Windows SmartScreen may warn because the exe is not
            code-signed: *More info → Run anyway*. `HeadTrackPC-console.exe --cli` shows the angles in a console.
          files: HeadTrackPC-${{ steps.tag.outputs.name }}-windows.zip
