name: windows

# Every push builds the installer and the portable zip and keeps them as a run artifact (GitHub
# login needed, expires after 90 days). A tag `vX.Y.Z` or `X.Y.Z` (or "Run workflow" with a tag
# name) also publishes both on the Releases page, where anyone can download them without an
# account. A release created by hand on GitHub pushes its tag, so it gets the files too.
on:
  push:
    branches: ["**"]
    tags: ["v*", "[0-9]*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub Release with this tag (e.g. v1.0.0 or 1.0.0); empty = build only"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  linux-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - run: python -m unittest discover -s tests -t . -v

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Fetch model and opentrack client DLLs
        run: |
          python tools/fetch_models.py
          python tools/fetch_opentrack_libs.py
          python tools/fetch_assets.py
      - name: Unit tests (incl. real NPClient64.dll / freetrackclient64.dll round trip)
        run: python -m unittest discover -s tests -t . -v
      - name: Build exe (PyInstaller)
        run: pyinstaller --noconfirm headtrack-pc.spec
      - name: Version
        id: ver
        shell: bash
        run: echo "v=$(python -c 'import headtrack_pc; print(headtrack_pc.__version__)')" >> "$GITHUB_OUTPUT"
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.ver.outputs.v }} installer\HeadTrackPC.iss
          Get-Item dist\HeadTrackPC-${{ steps.ver.outputs.v }}-Setup.exe
      - name: Portable zip
        run: Compress-Archive -Path dist\HeadTrackPC -DestinationPath dist\HeadTrackPC-${{ steps.ver.outputs.v }}-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: HeadTrackPC-windows
          path: |
            dist/HeadTrackPC-${{ steps.ver.outputs.v }}-Setup.exe
            dist/HeadTrackPC-${{ steps.ver.outputs.v }}-portable.zip
      - name: Release tag
        id: tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ github.event.inputs.release_tag }}" ]]; then
            echo "name=${{ github.event.inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          fi
      - uses: softprops/action-gh-release@v2
        if: steps.tag.outputs.name != ''
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: HeadTrack PC ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          body: |
            **Windows, nothing else to install.**
            - `HeadTrackPC-${{ steps.ver.outputs.v }}-Setup.exe`: installer (per user, no admin needed), Start menu + optional desktop shortcut.
            - `HeadTrackPC-${{ steps.ver.outputs.v }}-portable.zip`: unzip anywhere and run `HeadTrackPC.exe`.

            Windows SmartScreen may warn the first time because the files are not code-signed: *More info → Run anyway*.
          files: |
            dist/HeadTrackPC-${{ steps.ver.outputs.v }}-Setup.exe
            dist/HeadTrackPC-${{ steps.ver.outputs.v }}-portable.zip
